<title id="t">Beyond Frame Control</title>
<desc id="d">Private · Discord bot · v0.1. The control center for Ward Zero: a Python Discord bot plus a Lua bridge, so the team can handle permissions, moderation and the game server straight from Discord, with an audit log for every action.</desc>
