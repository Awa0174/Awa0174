<title id="t">1. Platz beim Halloween Game Jam</title>
<desc id="d">nanos world · Halloween Game Jam 2026 · 4. November 2026. Mit Jack’s Last Show (eingereicht als „Death in the Box“) hat unser Team TimeTales das öffentliche Playtest-Wochenende gewonnen – und dazu zwei Sonderpreise. Gesamtwertung: 1. Platz, 4,69. Best Theme Fit: Sonderpreis, 4,77. Best Creativity: Sonderpreis, 4,74.</desc>
